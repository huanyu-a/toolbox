<div class="container foot-history" id="foot-history">
    <div class="row">
        <div class="col-md-12"><span>您的足迹：</span><span id="visit_history"></span></div>
    </div>
</div>
<div class="container foot-nav-wrap">
    <div class="row">
        <div class="col-md-12 footer-nav">
            <h2>在线工具箱导航</h2>
            {volist name="tools" id="cat"}
            <div class="foot-cat">
                <h3>{$cat.cat}</h3>
                <ul>
                    {volist name="cat.items" id="tool"}
                    <li><a href="{$tool.url}"{if condition="$tool.accent != ''"} style="color:{$tool.accent}"{/if}>{$tool.name}</a></li>
                    {/volist}
                </ul>
            </div>
            {/volist}
        </div>
    </div>
</div>

<link rel="canonical" href="{:htmlspecialchars(site_base())}{$current_url_rel|default='/'}" />
<meta name="robots" content="{if condition="isset($noindex)"}noindex,follow{else/}index,follow{/if}" />
<meta property="og:type" content="website" />
<meta property="og:locale" content="zh_CN" />
<meta property="og:site_name" content="{$Think.config.web.site.name}" />
<meta property="og:title" content="{$page_title|default=''}" />
<meta property="og:description" content="{$page_desc|default=''}" />
<meta property="og:url" content="{:htmlspecialchars(site_base())}{$current_url_rel|default='/'}" />
<meta property="og:image" content="{:htmlspecialchars(site_base())}/favicon.ico" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{$page_title|default=''}" />
<meta name="twitter:description" content="{$page_desc|default=''}" />
{if condition="isset($jsonld) && $jsonld != ''"}<script type="application/ld+json">{$jsonld|raw}</script>{/if}

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.texttool.title}-{$Think.config.web.site.name}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.texttool.keywords}" /><meta name="description" content="{$Think.config.web.texttool.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css"/>
    <link href="/static/style/tool-theme.css" rel="stylesheet" type="text/css"/><link href="/static/style/tool-upgrade.css?v=2026090101" rel="stylesheet" type="text/css"/><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico"><i class="fa-solid fa-calculator" aria-hidden="true"></i></span>文本工具</h2>
        <p class="tool-desc">内容去重、字符串压缩、文本对比三种文本处理工具合集，全程浏览器本地运算。</p>
        <ul class="t-tabs" id="ttTabs">
            <li><button type="button" class="t-tab active" data-panel="ttUnique">内容去重</button></li>
            <li><button type="button" class="t-tab" data-panel="ttZip">字符串压缩</button></li>
            <li><button type="button" class="t-tab" data-panel="ttDiff">文本对比</button></li>
        </ul>

        <!-- 内容去重 -->
        <div id="ttUnique" class="t-panel tt-panel active">
            <label class="t-label" for="uqInput">待去重内容（每行一条）</label>
            <textarea class="t-area" id="uqInput" rows="8" placeholder="请输入要去重的内容，每行一条"></textarea>
            <div class="tool-actions">
                <button class="t-btn t-btn-ok" type="button" id="uqGo">去重处理</button>
                <button class="t-btn t-btn-ghost" type="button" id="uqClear">清空</button>
            </div>
            <label class="t-label" for="uqResult">去重结果</label>
            <div class="t-result" id="uqResultBox">
                <button class="t-copy" type="button" data-copy="#uqResultText">复制</button>
                <div id="uqResultText"></div>
            </div>
            <div class="t-error" id="uqError"></div>
        </div>

        <!-- 字符串压缩 -->
        <div id="ttZip" class="t-panel tt-panel">
            <label class="t-label" for="zpInput">原文（含空格 / 换行 / 制表符）</label>
            <textarea class="t-area" id="zpInput" rows="8" placeholder="请输入要压缩的内容或字符串"></textarea>
            <div class="tool-actions">
                <button class="t-btn t-btn-ok" type="button" id="zpBtn">压缩文本/字符串 →</button>
                <button class="t-btn t-btn-ghost" type="button" data-copy="#zpOut">复制结果</button>
                <button class="t-btn t-btn-ghost" type="button" id="zpClear">清空</button>
            </div>
            <label class="t-label" for="zpOut">压缩结果</label>
            <textarea class="t-area t-area-readonly" id="zpOut" rows="8" readonly placeholder="压缩结果将显示在这里"></textarea>
            <div class="t-result" id="zpInfo"></div>
            <div class="t-error" id="zpError"></div>
        </div>

        <!-- 文本对比 -->
        <div id="ttDiff" class="t-panel tt-panel">
            <div class="t-grid">
                <div class="t-col">
                    <label class="t-label" for="tdBase">基础文本</label>
                    <textarea class="t-area" id="tdBase" rows="8" placeholder="请输入基础文本"></textarea>
                </div>
                <div class="t-col">
                    <label class="t-label" for="tdNew">对比文本</label>
                    <textarea class="t-area" id="tdNew" rows="8" placeholder="请输入要对比文本"></textarea>
                </div>
            </div>
            <div class="tool-actions">
                <button class="t-btn t-btn-ok" type="button" id="tdBtn">立即对比</button>
                <button class="t-btn t-btn-ghost" type="button" id="tdClear">清空</button>
            </div>
            <label class="t-label" for="tdOutput">对比结果</label>
            <div class="t-result" id="tdOutput"></div>
            <div class="t-error" id="tdError"></div>
        </div>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/pcjs/txtdifflib.js" type="text/javascript"></script>
<script src="/static/script/pcjs/txtdiffview.js" type="text/javascript"></script>
<script src="/static/script/tool-upgrade.js?v=2026090101" type="text/javascript"></script><script src="/static/script/app.js?v=2026083026" type="text/javascript"></script>
<script>
(function () {
    var tabs = document.querySelectorAll('#ttTabs .t-tab');
    var panels = document.querySelectorAll('.tt-panel');
    tabs.forEach(function (btn) {
        btn.addEventListener('click', function () {
            tabs.forEach(function (b) { b.classList.remove('active'); });
            panels.forEach(function (p) { p.classList.remove('active'); });
            btn.classList.add('active');
            document.getElementById(btn.getAttribute('data-panel')).classList.add('active');
        });
    });
})();
(function () {
    function showErr(el, m) { el.textContent = m; el.classList.add('show'); }
    function hideErr(el) { el.classList.remove('show'); }

    /* 内容去重 */
    var uqInput = document.getElementById('uqInput'), uqResultBox = document.getElementById('uqResultBox'), uqResultText = document.getElementById('uqResultText'), uqError = document.getElementById('uqError');
    document.getElementById('uqGo').addEventListener('click', function () {
        hideErr(uqError);
        var v = uqInput.value;
        if (!v) { showErr(uqError, '请输入要去重的内容'); uqResultBox.classList.remove('show'); return; }
        var seen = new Set(), out = [];
        var lines = v.split('\n');
        for (var i = 0; i < lines.length; i++) {
            if (!seen.has(lines[i])) { seen.add(lines[i]); out.push(lines[i]); }
        }
        uqResultText.textContent = out.join('\n');
        uqResultBox.classList.add('show');
    });
    document.getElementById('uqClear').addEventListener('click', function () {
        uqInput.value = ''; uqResultText.textContent = ''; uqResultBox.classList.remove('show'); hideErr(uqError); uqInput.focus();
    });

    /* 字符串压缩 */
    var zpInput = document.getElementById('zpInput'), zpOut = document.getElementById('zpOut'), zpInfo = document.getElementById('zpInfo'), zpError = document.getElementById('zpError');
    document.getElementById('zpBtn').addEventListener('click', function () {
        hideErr(zpError); zpInfo.textContent = '';
        var v = zpInput.value;
        if (!v) { showErr(zpError, '请输入要压缩的内容或字符串'); return; }
        var z = v.replace(/\r/g, '').replace(/\n/g, '').replace(/\s/g, '').replace(/[ ]/g, '');
        zpOut.value = z;
        zpInfo.textContent = '压缩前 ' + v.length + ' 字符 → 压缩后 ' + z.length + ' 字符';
    });
    document.getElementById('zpClear').addEventListener('click', function () {
        zpInput.value = ''; zpOut.value = ''; zpInfo.textContent = ''; hideErr(zpError); zpInput.focus();
    });

    /* 文本对比（difflib / diffview） */
    var tdBase = document.getElementById('tdBase'), tdNew = document.getElementById('tdNew'), tdOutput = document.getElementById('tdOutput'), tdError = document.getElementById('tdError');
    document.getElementById('tdBtn').addEventListener('click', function () {
        hideErr(tdError);
        var base = difflib.stringAsLines(tdBase.value);
        var newtxt = difflib.stringAsLines(tdNew.value);
        if (!tdBase.value) { showErr(tdError, '请输入基础文本内容'); return; }
        if (!tdNew.value) { showErr(tdError, '请输入对比文本内容'); return; }
        var sm = new difflib.SequenceMatcher(base, newtxt);
        var opcodes = sm.get_opcodes();
        tdOutput.innerHTML = diffview.buildView({
            baseTextLines: base, newTextLines: newtxt, opcodes: opcodes,
            baseTextName: '基础文本', newTextName: '对比文本', contextSize: '', viewType: 0
        });
    });
    document.getElementById('tdClear').addEventListener('click', function () {
        tdBase.value = ''; tdNew.value = ''; tdOutput.innerHTML = ''; hideErr(tdError); tdBase.focus();
    });
})();
</script>
<script src="/static/script/sample-data.js?v=2026083026" type="text/javascript"></script>
</body></html>

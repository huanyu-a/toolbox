<li> <label class="w30-0"> <span>磅力</span><span class="mathunit">（lbf）</span></label> <input type="text" class="form-control ForceTxt" onkeyup="this.value=this.value.replace(/[^0-9.]/g,'')" onafterpaste="this.value=this.value.replace(/[^0-9.]/g,'')" placeholder="请输入数字"><a type="button" class="btn btn-default BtnHS">换算</a></li> <li> <label class="w30-0"> <span>千磅力</span><span class="mathunit">（kip）</span></label> <input type="text" class="form-control ForceTxt" onkeyup="this.value=this.value.replace(/[^0-9.]/g,'')" onafterpaste="this.value=this.value.replace(/[^0-9.]/g,'')" placeholder="请输入数字"><a type="button" class="btn btn-default BtnHS">换算</a></li> <li> <label class="w30-0"> <span>公吨力</span><span class="mathunit">（tf）</span></label> <input type="text" class="form-control ForceTxt" onkeyup="this.value=this.value.replace(/[^0-9.]/g,'')" onafterpaste="this.value=this.value.replace(/[^0-9.]/g,'')" placeholder="请输入数字"><a type="button" class="btn btn-default BtnHS">换算</a></li> </ul> <hr /> <input type="button" id="reset" class="btn btn-warning" value="全部重置"></div> </div> </div></div></div><script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script><script src="/static/script/bootstrap.min.js" type="text/javascript"></script><script src="/static/script/tool.js" type="text/javascript"></script><script type="text/javascript">var bs=[1,9.80665,0.0098067,999.9999971,2.2046226,0.0022046,0.001];var num=0;$(".BtnHS").on("click",function(){num=$(this).prev().val();if(num!=""&&!isNaN(num)){var tag=num/bs[$(".ForceCountCent li").index($(this).parent())];$(".ForceCountCent li").each(function(ind){$(this).find(".ForceTxt").val(bs[ind]*tag)})}});$("#reset").on("click",function(){$("input[type='text']").val("")});</script>{include file="nav" /}

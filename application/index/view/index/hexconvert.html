<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.hexconvert.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.hexconvert.keywords}" /><meta name="description" content="{$Think.config.web.hexconvert.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🔢</span>常用进制转换工具</h2>
        <p class="tool-desc">在二进制、八进制、十进制、十六进制之间互转，输入即时转换。</p>
        <div class="t-grid">
            <div class="t-col">
                <label class="t-label" for="hexInput">输入数值</label>
                <input class="t-input" style="width:100%" type="text" id="hexInput" placeholder="输入要转换的数值">
                <div class="t-options" style="margin-top:10px">
                    <label><input type="radio" name="hexFrom" value="2" checked> 二进制</label>
                    <label><input type="radio" name="hexFrom" value="8"> 八进制</label>
                    <label><input type="radio" name="hexFrom" value="10"> 十进制</label>
                    <label><input type="radio" name="hexFrom" value="16"> 十六进制</label>
                </div>
            </div>
            <div class="t-col">
                <label class="t-label">转换结果</label>
                <div class="t-result" id="hexResult" style="display:block">
                    <div style="margin-bottom:8px"><span class="t-result-label">二进制：</span><span id="hexOut2"></span></div>
                    <div style="margin-bottom:8px"><span class="t-result-label">八进制：</span><span id="hexOut8"></span></div>
                    <div style="margin-bottom:8px"><span class="t-result-label">十进制：</span><span id="hexOut10"></span></div>
                    <div><span class="t-result-label">十六进制：</span><span id="hexOut16"></span></div>
                    <button class="t-copy" type="button" data-copy="#hexOut10">复制十进制</button>
                </div>
            </div>
        </div>
        <div class="t-error" id="hexError"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 进制说明</h2>
        <p class="tool-desc">二进制由 0 和 1 组成；八进制使用 0-7；十进制为日常使用的 0-9；十六进制使用 0-9 和 A-F。输入时十六进制可带或不带 0x 前缀。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var error = document.getElementById('hexError');
    function showErr(m) { error.textContent = m; error.classList.add('show'); }
    function hideErr() { error.classList.remove('show'); }
    function run() {
        hideErr();
        var input = document.getElementById('hexInput').value.trim();
        var from = parseInt(document.querySelector('input[name="hexFrom"]:checked').value, 10);
        if (!input) {
            ['hexOut2', 'hexOut8', 'hexOut10', 'hexOut16'].forEach(function (id) { document.getElementById(id).textContent = ''; });
            return;
        }
        var cleaned = input;
        if (from === 16 && /^0x/i.test(cleaned)) cleaned = cleaned.slice(2);
        var dec;
        try {
            dec = parseInt(cleaned, from);
            if (isNaN(dec)) throw new Error('invalid');
        } catch (e) {
            showErr('输入内容不符合所选进制的格式');
            return;
        }
        document.getElementById('hexOut2').textContent = dec.toString(2);
        document.getElementById('hexOut8').textContent = dec.toString(8);
        document.getElementById('hexOut10').textContent = dec.toString(10);
        document.getElementById('hexOut16').textContent = dec.toString(16).toUpperCase();
    }
    var timer = null;
    document.getElementById('hexInput').addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(run, 300);
    });
    document.querySelectorAll('input[name="hexFrom"]').forEach(function (r) {
        r.addEventListener('change', run);
    });
})();
</script>
</body></html>

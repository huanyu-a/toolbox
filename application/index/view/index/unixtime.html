<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.unixtime.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.unixtime.keywords}" /><meta name="description" content="{$Think.config.web.unixtime.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">⏱️</span>Unix 时间戳在线转换</h2>
        <p class="tool-desc">Unix 时间戳与日期时间互转，支持毫秒级时间戳自动识别。当前时间戳：<span id="utLive">—</span></p>
        <div class="t-grid">
            <div class="t-col">
                <label class="t-label" for="utTs">Unix 时间戳（秒 / 毫秒）</label>
                <div class="t-row">
                    <input class="t-input t-flex1" type="text" id="utTs" placeholder="例如：1723430400">
                    <button class="t-btn" type="button" id="utTsConvert">转换</button>
                </div>
                <div class="t-result" id="utTsResult" style="margin-top:12px">
                    <div><span class="t-result-label">北京时间：</span><span id="utTsDate"></span></div>
                    <div><span class="t-result-label">UTC 时间：</span><span id="utTsUtc"></span></div>
                </div>
            </div>
            <div class="t-col">
                <label class="t-label" for="utDate">日期时间（格式：YYYY-MM-DD HH:mm:ss）</label>
                <div class="t-row">
                    <input class="t-input t-flex1" type="text" id="utDate" placeholder="例如：2024-08-12 10:00:00">
                    <button class="t-btn t-btn-ok" type="button" id="utDateConvert">转换</button>
                </div>
                <div class="t-result" id="utDateResult" style="margin-top:12px">
                    <div><span class="t-result-label">时间戳：</span><span id="utDateTs"></span></div>
                </div>
            </div>
        </div>
        <div class="tool-actions" style="margin-top:18px">
            <button class="t-btn t-btn-ghost" type="button" id="utNow">取当前时间戳</button>
            <button class="t-btn t-btn-ghost" type="button" data-copy="#utDateTs">复制结果</button>
        </div>
        <div class="t-error" id="utError"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 关于 Unix 时间戳</h2>
        <p class="tool-desc">Unix 时间戳是从 1970-01-01 00:00:00 UTC 起经过的秒数（毫秒级为毫秒数）。常用于程序开发、日志分析与接口调试。本站转换完全在本地完成。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var error = document.getElementById('utError');
    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function fmtDate(d) {
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
            ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    }
    function showErr(msg) { error.textContent = msg; error.classList.add('show'); }
    function hideErr() { error.classList.remove('show'); }
    function showTsResult(sec) {
        var d = new Date(sec * 1000);
        document.getElementById('utTsDate').textContent = fmtDate(d);
        document.getElementById('utTsUtc').textContent = d.toUTCString();
        document.getElementById('utTsResult').classList.add('show');
    }
    document.getElementById('utTsConvert').addEventListener('click', function () {
        hideErr();
        var v = document.getElementById('utTs').value.trim();
        if (!v) { showErr('请输入时间戳'); return; }
        var n = Number(v);
        if (isNaN(n) || n <= 0) { showErr('时间戳格式不正确'); return; }
        if (v.length >= 13) n = Math.floor(n / 1000);
        showTsResult(n);
    });
    document.getElementById('utDateConvert').addEventListener('click', function () {
        hideErr();
        var v = document.getElementById('utDate').value.trim();
        if (!v) { showErr('请输入日期时间'); return; }
        var d = new Date(v.replace(/-/g, '/'));
        if (isNaN(d.getTime())) { showErr('日期格式不正确，请使用 YYYY-MM-DD HH:mm:ss'); return; }
        document.getElementById('utDateTs').textContent = Math.floor(d.getTime() / 1000);
        document.getElementById('utDateResult').classList.add('show');
    });
    document.getElementById('utNow').addEventListener('click', function () {
        hideErr();
        var now = Math.floor(Date.now() / 1000);
        document.getElementById('utTs').value = now;
        showTsResult(now);
    });
    setInterval(function () {
        document.getElementById('utLive').textContent = Math.floor(Date.now() / 1000) + '（' + fmtDate(new Date()) + '）';
    }, 1000);
})();
</script>
</body></html>

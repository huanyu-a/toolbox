换算</a></li> <li> <label> <span>列氏度</span><span class="mathunit">（Re）</span></label> <input type="text" class="form-control TemperatureTxt" onkeyup="this.value=this.value.replace(/[^0-9.]/g,'')" onafterpaste="this.value=this.value.replace(/[^0-9.]/g,'')" placeholder="请输入数字"><a type="button" class="btn btn-default BtnHS">换算</a></li> </ul> <hr /> <input type="button" id="reset" class="btn btn-warning" value="全部重置"></div> </div> </div></div></div><script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script><script src="/static/script/bootstrap.min.js" type="text/javascript"></script><script src="/static/script/tool.js" type="text/javascript"></script><script type="text/javascript">var bs=[1,33.8,274.15,493.47,0.8];var num=0;$(".BtnHS").on("click",function(){num=$(this).prev().val();if(num!=""&&!isNaN(num)){var tag=num/bs[$(".TemperatureCountCent li").index($(this).parent())];$(".TemperatureCountCent li").each(function(ind){$(this).find(".TemperatureTxt").val(bs[ind]*tag)})}});$("#reset").on("click",function(){$("input[type='text']").val("")});</script>{include file="nav" /}

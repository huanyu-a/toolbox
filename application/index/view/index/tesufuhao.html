    ];

    var $grid = document.getElementById('tsf-grid');
    var $tabs = document.getElementById('tsf-tabs');
    var $toast = document.getElementById('tsf-toast');
    var toastTimer = null;

    function showToast(msg) {
        $toast.textContent = msg || '已复制';
        $toast.style.display = 'block';
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { $toast.style.display = 'none'; }, 1200);
    }

    function copyText(text) {
        function done(ok) {
            showToast(ok ? '已复制：' + text : '复制失败，请手动复制');
        }
        // 现代 API
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
        } else {
            fallback();
        }
        function fallback() {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try {
                var ok = document.execCommand('copy');
                done(ok);
            } catch (e) {
                done(false);
            }
            document.body.removeChild(ta);
        }
    }

    function renderGrid(chars) {
        var html = '';
        // 按 Unicode 码点遍历（避免 emoji 被 charAt 拆成乱码）
        var arr = Array.from(chars);
        for (var i = 0; i < arr.length; i++) {
            var ch = arr[i];
            if (ch === ' ' || ch === '\n' || ch === '\t') continue;
            var name = (window.SYMBOL_NAMES && window.SYMBOL_NAMES[ch]) || '';
            html += '<span class="tsf-item" title="' + name.replace(/"/g, '&quot;') + '" data-c="' + ch.replace(/"/g, '&quot;') + '">' + ch + '</span>';
        }
        $grid.innerHTML = html;
    }

    function buildTabs() {
        var html = '';
        for (var i = 0; i < CATS.length; i++) {
            html += '<li' + (i === 0 ? ' class="active"' : '') + '><a href="javascript:" data-i="' + i + '">' + CATS[i].name + '</a></li>';
        }
        $tabs.innerHTML = html;
    }

    // 点击符号复制（事件委托）
    $grid.addEventListener('click', function (e) {
        var target = e.target;
        while (target && target !== $grid && !(target.className && target.className.indexOf('tsf-item') >= 0)) {
            target = target.parentNode;
        }
        if (target && target.className && target.className.indexOf('tsf-item') >= 0) {
            var ch = target.getAttribute('data-c');
            if (ch) {
                copyText(ch);
                target.className = 'tsf-item copied';
                setTimeout(function () { target.className = 'tsf-item'; }, 600);
            }
        }
    });

    // tab 切换
    $tabs.addEventListener('click', function (e) {
        var target = e.target;
        while (target && target !== $tabs && target.tagName !== 'A') {
            target = target.parentNode;
        }
        if (target && target.tagName === 'A') {
            var idx = parseInt(target.getAttribute('data-i'), 10);
            if (!isNaN(idx) && CATS[idx]) {
                var lis = $tabs.getElementsByTagName('li');
                for (var i = 0; i < lis.length; i++) {
                    lis[i].className = (i === idx) ? 'active' : '';
                }
                renderGrid(CATS[idx].chars);
            }
        }
    });

    buildTabs();
    renderGrid(CATS[0].chars);
})();

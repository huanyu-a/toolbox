<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.random.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.random.keywords}" /><meta name="description" content="{$Think.config.web.random.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🎲</span>随机数生成器</h2>
        <p class="tool-desc">生成指定范围、数量的随机数，支持整数 / 小数 / 随机字符串。</p>
        <div class="t-row" style="margin-bottom:14px">
            <div class="t-col" style="flex:1;min-width:120px">
                <label class="t-label">最小值</label>
                <input class="t-input" style="width:100%" type="number" id="rndMin" value="1">
            </div>
            <div class="t-col" style="flex:1;min-width:120px">
                <label class="t-label">最大值</label>
                <input class="t-input" style="width:100%" type="number" id="rndMax" value="100">
            </div>
            <div class="t-col" style="flex:1;min-width:120px">
                <label class="t-label">生成数量</label>
                <input class="t-input" style="width:100%" type="number" id="rndCount" value="10" min="1" max="1000">
            </div>
            <div class="t-col" style="flex:1;min-width:120px">
                <label class="t-label">类型</label>
                <select class="t-input" style="width:100%" id="rndType">
                    <option value="int">整数</option>
                    <option value="float">小数（2位）</option>
                    <option value="str">随机字符串</option>
                </select>
            </div>
        </div>
        <div class="tool-actions">
            <button class="t-btn" type="button" id="rndRun">生成</button>
            <button class="t-btn t-btn-ghost" type="button" data-copy="#rndOutput">复制结果</button>
            <button class="t-btn t-btn-ghost" type="button" id="rndClear">清空</button>
        </div>
        <div class="t-result" id="rndResult"><textarea class="t-area t-area-readonly" id="rndOutput" rows="8" readonly></textarea></div>
        <div class="t-error" id="rndError"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 使用说明</h2>
        <p class="tool-desc">整数：在最小值和最大值之间生成随机整数（含两端）。小数：保留两位小数。随机字符串：生成由字母和数字组成的随机串。本工具使用浏览器密码学级随机源（crypto.getRandomValues）。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var error = document.getElementById('rndError');
    function showErr(m) { error.textContent = m; error.classList.add('show'); }
    function hideErr() { error.classList.remove('show'); }
    function randInt(min, max) {
        var range = max - min + 1;
        var arr = new Uint32Array(1);
        window.crypto.getRandomValues(arr);
        return min + (arr[0] % range);
    }
    function randStr(len) {
        var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var out = '';
        var arr = new Uint32Array(len);
        window.crypto.getRandomValues(arr);
        for (var i = 0; i < len; i++) out += chars[arr[i] % chars.length];
        return out;
    }
    document.getElementById('rndRun').addEventListener('click', function () {
        hideErr();
        var min = parseFloat(document.getElementById('rndMin').value);
        var max = parseFloat(document.getElementById('rndMax').value);
        var count = parseInt(document.getElementById('rndCount').value, 10);
        var type = document.getElementById('rndType').value;
        if (isNaN(min) || isNaN(max)) { showErr('请填写有效的数值范围'); return; }
        if (min > max) { showErr('最小值不能大于最大值'); return; }
        if (isNaN(count) || count < 1) count = 1;
        if (count > 1000) count = 1000;
        var list = [];
        for (var i = 0; i < count; i++) {
            if (type === 'int') list.push(randInt(Math.ceil(min), Math.floor(max)));
            else if (type === 'float') list.push((Math.random() * (max - min) + min).toFixed(2));
            else list.push(randStr(randInt(6, 16)));
        }
        document.getElementById('rndOutput').value = list.join('\n');
        document.getElementById('rndResult').classList.add('show');
    });
    document.getElementById('rndClear').addEventListener('click', function () {
        document.getElementById('rndOutput').value = '';
        document.getElementById('rndResult').classList.remove('show');
        hideErr();
    });
})();
</script>
</body></html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.json2get.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.json2get.keywords}" /><meta name="description" content="{$Think.config.web.json2get.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" />
<link href="/static/style/site.min.css" rel="stylesheet" type="text/css"/><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}<div class="container"><div class="tool-wrap"><div class="tool-card"><h2 class="tool-title"><span class="t-ico">🔄</span>JSON和GET参数互转</h2><p class="tool-desc">JSON和GET参数转换工具为您提供在线json转url,JSON转GET请求字符串,JSON和GET参数转换,json转get请求参数,自动拼接Url参数,</p><form id="form1" class="form-horizontal" method="post"><div class="form-group"><div class="col-sm-12"><textarea class="form-control" onmouseover="this.focus();" id="content" name="content" rows="10" placeholder="请输入需转换的内容"></textarea></div></div><div class="form-group navi"><div class="col-sm-12 text-center"><button type="button" class="btn btn-success" onclick="Json2Get(1);">JSON转GET参数</button><button type="button" class="btn btn-success" onclick="Json2Get(2);">GET参数转JSON</button><span id="copyallcode" class="btn btn-default" data-clipboard-target="#result">复制结果</span><input type="button" onclick="ClearAll();" value="清空" class="btn btn-default"></div></div><div class="form-group"><div class="col-sm-12"><pre><code id="result"></code></pre></div></div></form></div></div></div><script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script><script src="/static/script/bootstrap.min.js" type="text/javascript"></script><script src="/static/script/tool.js" type="text/javascript"></script><script src="/static/script/hightout.js" type="text/javascript"></script><script type="text/javascript">function Json2Get(type) {var cont = $("#content").val();if (type == 1) {cont = cont.replace(/\t/g, "");cont = cont.replace(/\"/g, "").replace("{", "").replace("}", "").replace(",", "&").replace(":", "=");cont = cont.replace(/\"/g, "").replace(/{/g, "").replace(/}/g, "").replace(/,/g, "&").replace(/:/g, "=");} else {cont = cont.replace(/&/g, '","').replace(/;/g, '","').replace(/=/g, '":"');cont = '{"' + cont + '"}';}hightout(cont);}</script>{include file="nav" /}

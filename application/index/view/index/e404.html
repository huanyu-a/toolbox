<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>页面未找到 - {$Think.config.web.site.name}</title>
    <meta name="robots" content="noindex,follow"/>
    <meta name="applicable-device" content="pc,mobile"/>
    <meta http-equiv="Cache-Control" content="no-transform"/>
    <meta http-equiv="Cache-Control" content="no-siteapp"/>
    <meta name="renderer" content="webkit"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon"/>
    <link href="/static/style/site.min.css" rel="stylesheet" type="text/css"/>
    <link href="/static/style/theme-uno.css?v=2026082815" rel="stylesheet" type="text/css"/>
    {:$Think.config.web.header}
    {include file="seo" /}
</head>
<body>
{include file="header" /}

<main class="home-wrap">
    <section class="home-hero">
        <div class="home-hero-mesh" aria-hidden="true"></div>
        <div class="home-hero-inner">
            <span class="home-badge"><i class="fa-solid fa-triangle-exclamation"></i> 页面未找到</span>
            <h1 class="home-title">抱歉，这个页面不存在</h1>
            <p class="home-sub">你访问的地址可能已下线、改版或输入有误。</p>
            <div style="text-align:center">
                <a href="/" class="t-btn t-btn-ok" style="display:inline-block;min-width:180px;font-size:16px"><i class="fa-solid fa-arrow-left"></i> 回到首页</a>
            </div>
        </div>
    </section>
    <section style="padding:48px 0">
        <div class="container">
            <div style="max-width:560px;margin:0 auto;background:var(--surface,#fff);border:1px solid var(--border,#e5e7eb);border-radius:var(--radius,14px);padding:32px">
                <h2 style="margin:0 0 8px;font-size:18px;color:var(--tb-text,#111)">你可以试试</h2>
                <ul style="color:var(--tb-text-2,#666);line-height:2;padding-left:20px;margin:0">
                    <li>直接从顶部导航栏选择你需要的工具</li>
                    <li>在首页搜索框输入关键词（<kbd>Ctrl</kbd> + <kbd>K</kbd> 快捷唤起）</li>
                    <li>检查地址是否正确，或清除浏览器缓存后重试</li>
                </ul>
            </div>
        </div>
    </section>
</main>

{include file="footer" /}
<script>
(function(){
    var search = document.getElementById('homeSearch');
    if (search) search.focus();
})();
</script>
</body>
</html>

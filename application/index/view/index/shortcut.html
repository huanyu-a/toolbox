<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.shortcut.title}-{$Think.config.web.site.name}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.shortcut.keywords}" /><meta name="description" content="{$Think.config.web.shortcut.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" />
<link href="/static/style/site.min.css" rel="stylesheet" type="text/css"/>
    <link href="/static/style/tool-theme.css" rel="stylesheet" type="text/css"/><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">⚡</span>生成桌面快捷方式</h2>
        <p class="tool-desc">将指定网址一键生成 Windows 桌面快捷方式图标文件，无需安装任何软件。</p>
        <form action="" method="post" target="_blank" id="form" name="form">
            <div class="form-group">
                <label class="t-label" for="name">名称</label>
                <input type="text" class="t-input" id="name" name="name" value="{$Think.server.HTTP_HOST|htmlspecialchars}在线工具" style="max-width:420px" />
            </div>
            <div class="form-group">
                <label class="t-label" for="url">网址</label>
                <input type="text" id="url" name="url" class="t-input" value="http://{$Think.server.HTTP_HOST|htmlspecialchars}/" style="max-width:420px" />
            </div>
            <div class="tool-actions">
                <button type="button" name="generate" onclick="check()" class="t-btn">创建快捷方式并下载</button>
            </div>
        </form>
    </div>
</div></div>
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script type="text/javascript">
            function check(){
                var  name=$("#name").val(),url=$("#url").val();
                window.location.href="/doapi?save_name="+name+"&save_url="+url;
            }
        </script>{include file="nav" /}
{include file="footer" /}
<script src="/static/script/app.js?v=2026083015" type="text/javascript"></script>
<script src="/static/script/sample-data.js" type="text/javascript"></script>
</body></html>

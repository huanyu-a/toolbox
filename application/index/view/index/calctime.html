 class="mathunit">（s）</span></label> <input type="text" class="form-control TimeTxt" onkeyup="this.value=this.value.replace(/[^0-9.]/g,'')" onafterpaste="this.value=this.value.replace(/[^0-9.]/g,'')" placeholder="请输入数字"><a type="button" class="btn btn-default BtnHS">换算</a></li> <li> <label> <span>毫秒</span><span class="mathunit">（ms）</span></label> <input type="text" class="form-control TimeTxt" onkeyup="this.value=this.value.replace(/[^0-9.]/g,'')" onafterpaste="this.value=this.value.replace(/[^0-9.]/g,'')" placeholder="请输入数字"><a type="button" class="btn btn-default BtnHS">换算</a></li> <li> <label> <span>年</span><span class="mathunit">（yr）</span></label> <input type="text" class="form-control TimeTxt" onkeyup="this.value=this.value.replace(/[^0-9.]/g,'')" onafterpaste="this.value=this.value.replace(/[^0-9.]/g,'')" placeholder="请输入数字"><a type="button" class="btn btn-default BtnHS">换算</a></li> </ul> <hr /> <input type="button" id="reset" class="btn btn-warning" value="全部重置"></div> </div></div></div></div><script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script><script src="/static/script/bootstrap.min.js" type="text/javascript"></script><script src="/static/script/tool.js" type="text/javascript"></script><script type="text/javascript">var bs=[1,24,0.1428571,1440.0000288,86400,86400000,0.0027397];var num=0;$(".BtnHS").on("click",function(){num=$(this).prev().val();if(num!=""&&!isNaN(num)){var tag=num/bs[$(".TimeCountCent li").index($(this).parent())];$(".TimeCountCent li").each(function(ind){$(this).find(".TimeTxt").val(bs[ind]*tag)})}});$("#reset").on("click",function(){$("input[type='text']").val("")});;</script>{include file="nav" /}

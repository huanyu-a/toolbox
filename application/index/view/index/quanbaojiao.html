<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.quanbaojiao.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.quanbaojiao.keywords}" /><meta name="description" content="{$Think.config.web.quanbaojiao.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" />
<link href="/static/style/site.min.css" rel="stylesheet" type="text/css"/><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🔁</span>全角半角转换</h2>
        <p class="tool-desc">全角半角转换器提供全角与半角互转,全角半角转换工具,很方便的将全角字符和半角字符相互切换,全角指一个字符占用两个标准字符位置,半角指一字符占用一个标准的字符位置,全角半角区别</p>
        <label class="t-label" for="content">输入文本</label>
        <textarea class="t-area" id="content" rows="10" placeholder="请输入要转换的文本"></textarea>
        <div class="tool-actions">
            <button class="t-btn t-btn-ok" type="button" id="toHalfBtn">全角转半角</button>
            <button class="t-btn" type="button" id="toFullBtn">半角转全角</button>
            <button class="t-btn t-btn-ghost" type="button" data-copy="#result">复制结果</button>
            <button class="t-btn t-btn-ghost" type="button" id="clearBtn">清空</button>
        </div>
        <label class="t-label" for="result">转换结果</label>
        <pre class="t-result" id="result"></pre>
        <div class="t-error" id="tError"></div>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var input = document.getElementById('content');
    var result = document.getElementById('result');
    var error = document.getElementById('tError');

    function showErr(m) { error.textContent = m; error.classList.add('show'); }
    function hideErr() { error.classList.remove('show'); }

    function toFull(s) {
        var tmp = '';
        for (var i = 0; i < s.length; i++) {
            var c = s.charCodeAt(i);
            if (c === 32) tmp += String.fromCharCode(12288);
            else if (c < 127) tmp += String.fromCharCode(c + 65248);
            else tmp += s.charAt(i);
        }
        return tmp;
    }

    function toHalf(s) {
        var tmp = '';
        for (var i = 0; i < s.length; i++) {
            var c = s.charCodeAt(i);
            if (c > 65280 && c < 65375) tmp += String.fromCharCode(c - 65248);
            else if (c === 12288) tmp += ' ';
            else tmp += s.charAt(i);
        }
        return tmp;
    }

    document.getElementById('toHalfBtn').addEventListener('click', function () {
        hideErr();
        var v = input.value;
        if (!v) { showErr('请输入要转换的字符'); return; }
        result.textContent = toHalf(v);
    });

    document.getElementById('toFullBtn').addEventListener('click', function () {
        hideErr();
        var v = input.value;
        if (!v) { showErr('请输入要转换的字符'); return; }
        result.textContent = toFull(v);
    });

    document.getElementById('clearBtn').addEventListener('click', function () {
        input.value = '';
        result.textContent = '';
        hideErr();
        input.focus();
    });
})();
</script>
</body></html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.json.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.json.keywords}" /><meta name="description" content="{$Think.config.web.json.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🪄</span>JSON 格式化 / 压缩 / 校验</h2>
        <p class="tool-desc">粘贴 JSON 内容自动实时格式化，支持压缩与错误定位提示，全程本地解析。</p>
        <label class="t-label" for="jsonInput">JSON 内容</label>
        <textarea class="t-area" id="jsonInput" rows="10" placeholder='{"name":"在线工具箱","tools":162}'></textarea>
        <div class="t-options" style="margin-top:12px">
            <label><input type="radio" name="jsonMode" value="format" checked> 格式化</label>
            <label><input type="radio" name="jsonMode" value="compress"> 压缩</label>
            <label><input type="checkbox" id="jsonSort"> 键名排序</label>
            <label><input type="checkbox" id="jsonEscape"> 转义为字符串</label>
        </div>
        <div class="tool-actions">
            <button class="t-btn" type="button" id="jsonRun">格式化</button>
            <button class="t-btn t-btn-ghost" type="button" data-copy="#jsonOutput">复制结果</button>
            <button class="t-btn t-btn-ghost" type="button" id="jsonClear">清空</button>
        </div>
        <div class="t-result" id="jsonResult"><textarea class="t-area t-area-readonly" id="jsonOutput" rows="12" readonly></textarea></div>
        <div class="t-error" id="jsonError"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 关于 JSON</h2>
        <p class="tool-desc">JSON（JavaScript Object Notation）是一种轻量级数据交换格式，广泛用于前后端通信与配置文件。本站的 JSON 工具支持格式化、压缩、键排序、转义，并可准确定位语法错误位置。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var input = document.getElementById('jsonInput');
    var output = document.getElementById('jsonOutput');
    var result = document.getElementById('jsonResult');
    var error = document.getElementById('jsonError');
    function getMode() {
        var m = document.querySelector('input[name="jsonMode"]:checked');
        return m ? m.value : 'format';
    }
    function sortKeys(obj) {
        if (Array.isArray(obj)) return obj.map(sortKeys);
        if (obj && typeof obj === 'object') {
            var out = {};
            Object.keys(obj).sort().forEach(function (k) { out[k] = sortKeys(obj[k]); });
            return out;
        }
        return obj;
    }
    function run() {
        error.classList.remove('show');
        result.classList.remove('show');
        var raw = input.value.trim();
        if (!raw) { error.textContent = '请输入 JSON 内容'; error.classList.add('show'); return; }
        var data;
        try {
            data = JSON.parse(raw);
        } catch (e) {
            var m = e.message;
            error.textContent = 'JSON 解析失败：' + m;
            error.classList.add('show');
            return;
        }
        if (document.getElementById('jsonSort').checked) data = sortKeys(data);
        var out;
        if (getMode() === 'compress') {
            out = JSON.stringify(data);
        } else {
            out = JSON.stringify(data, null, 4);
        }
        if (document.getElementById('jsonEscape').checked) {
            out = JSON.stringify(out);
        }
        output.value = out;
        result.classList.add('show');
    }
    document.getElementById('jsonRun').addEventListener('click', run);
    document.getElementById('jsonClear').addEventListener('click', function () {
        input.value = ''; output.value = '';
        error.classList.remove('show'); result.classList.remove('show');
        input.focus();
    });
    var timer = null;
    input.addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(run, 500);
    });
})();
</script>
</body></html>

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.base64.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.base64.keywords}" /><meta name="description" content="{$Think.config.web.base64.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🔡</span>Base64 加密 / 解密</h2>
        <p class="tool-desc">支持中文的 Base64 编码与解码，完全本地计算，内容不会上传服务器。</p>
        <div class="t-grid">
            <div class="t-col">
                <label class="t-label" for="b64Input">明文 / 密文</label>
                <textarea class="t-area" id="b64Input" rows="8" placeholder="输入要编码或解码的内容…"></textarea>
            </div>
            <div class="t-col">
                <label class="t-label" for="b64Output">结果</label>
                <textarea class="t-area t-area-readonly" id="b64Output" rows="8" readonly placeholder="结果将显示在这里…"></textarea>
            </div>
        </div>
        <div class="tool-actions">
            <button class="t-btn" type="button" id="b64Encode">编码 →</button>
            <button class="t-btn t-btn-ok" type="button" id="b64Decode">解码 ←</button>
            <button class="t-btn t-btn-ghost" type="button" data-copy="#b64Output">复制结果</button>
            <button class="t-btn t-btn-ghost" type="button" id="b64Swap">⇄ 交换</button>
            <button class="t-btn t-btn-ghost" type="button" id="b64Clear">清空</button>
        </div>
        <div class="t-error" id="b64Error"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 关于 Base64</h2>
        <p class="tool-desc">Base64 是一种基于 64 个可打印字符表示二进制数据的编码方式，常用于在 URL、邮件、JSON 等场景传输数据。注意：Base64 是可逆编码，并非加密，不适合保护敏感信息。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var input = document.getElementById('b64Input');
    var output = document.getElementById('b64Output');
    var error = document.getElementById('b64Error');
    function showErr(msg) {
        error.textContent = msg;
        error.classList.add('show');
    }
    function hideErr() { error.classList.remove('show'); }
    document.getElementById('b64Encode').addEventListener('click', function () {
        hideErr();
        if (!input.value) { showErr('请输入要编码的内容'); return; }
        output.value = Tools.base64Encode(input.value);
    });
    document.getElementById('b64Decode').addEventListener('click', function () {
        hideErr();
        if (!input.value) { showErr('请输入要解码的内容'); return; }
        try {
            output.value = Tools.base64Decode(input.value);
        } catch (e) {
            showErr('解码失败：不是合法的 Base64 内容');
        }
    });
    document.getElementById('b64Swap').addEventListener('click', function () {
        var t = input.value; input.value = output.value; output.value = t;
    });
    document.getElementById('b64Clear').addEventListener('click', function () {
        input.value = ''; output.value = ''; hideErr(); input.focus();
    });
})();
</script>
</body></html>

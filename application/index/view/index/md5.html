<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.md5.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.md5.keywords}" /><meta name="description" content="{$Think.config.web.md5.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🔐</span>MD5 加密工具</h2>
        <p class="tool-desc">输入内容，实时计算 MD5 32 位 / 16 位大小写哈希值，全程本地计算，不上传服务器。</p>
        <label class="t-label" for="md5Input">输入内容</label>
        <textarea class="t-area" id="md5Input" rows="6" placeholder="请输入要加密的字符串…"></textarea>
        <div class="tool-actions">
            <button class="t-btn" type="button" id="md5Run">开始加密</button>
            <button class="t-btn t-btn-ghost" type="button" id="md5Clear">清空</button>
        </div>
        <div class="t-result" id="md5Result">
            <button class="t-copy" type="button" data-copy="#md5ResultText">复制</button>
            <div id="md5ResultText"></div>
        </div>
        <div class="t-error" id="md5Error"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 关于 MD5</h2>
        <p class="tool-desc">MD5 是一种不可逆的哈希算法，将任意长度的数据映射为固定 128 位（32 个十六进制字符）的"数字指纹"，常用于校验数据一致性。本站不会记录您的任何输入，请放心使用。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var input = document.getElementById('md5Input');
    var result = document.getElementById('md5Result');
    var resultText = document.getElementById('md5ResultText');
    var error = document.getElementById('md5Error');
    function run() {
        var v = input.value;
        error.classList.remove('show');
        if (!v) {
            result.classList.remove('show');
            error.textContent = '请输入要加密的内容';
            error.classList.add('show');
            return;
        }
        var m32 = Tools.md5(v);
        var m16 = Tools.md5_16(v);
        var html = '';
        html += '<div><span class="t-result-label">32位小写：</span>' + m32 + '</div>';
        html += '<div><span class="t-result-label">32位大写：</span>' + m32.toUpperCase() + '</div>';
        html += '<div><span class="t-result-label">16位小写：</span>' + m16 + '</div>';
        html += '<div><span class="t-result-label">16位大写：</span>' + m16.toUpperCase() + '</div>';
        resultText.innerHTML = html;
        result.classList.add('show');
    }
    document.getElementById('md5Run').addEventListener('click', run);
    document.getElementById('md5Clear').addEventListener('click', function () {
        input.value = '';
        result.classList.remove('show');
        error.classList.remove('show');
        input.focus();
    });
    input.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') run();
    });
})();
</script>
</body></html>

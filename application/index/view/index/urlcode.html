<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.urlcode.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.urlcode.keywords}" /><meta name="description" content="{$Think.config.web.urlcode.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🔗</span>URL 编码 / 解码</h2>
        <p class="tool-desc">对 URL 参数进行百分号编码或解码，支持中文与特殊字符，全程本地处理。</p>
        <div class="t-grid">
            <div class="t-col">
                <label class="t-label" for="urlInput">原始内容</label>
                <textarea class="t-area" id="urlInput" rows="7" placeholder="输入要编码或解码的内容…"></textarea>
            </div>
            <div class="t-col">
                <label class="t-label" for="urlOutput">结果</label>
                <textarea class="t-area t-area-readonly" id="urlOutput" rows="7" readonly placeholder="结果将显示在这里…"></textarea>
            </div>
        </div>
        <div class="tool-actions">
            <button class="t-btn" type="button" id="urlEncode">编码 →</button>
            <button class="t-btn t-btn-ok" type="button" id="urlDecode">解码 ←</button>
            <button class="t-btn t-btn-ghost" type="button" data-copy="#urlOutput">复制结果</button>
            <button class="t-btn t-btn-ghost" type="button" id="urlClear">清空</button>
        </div>
        <div class="t-error" id="urlError"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 关于 URL 编码</h2>
        <p class="tool-desc">URL 编码（Percent-encoding）将非 ASCII 字符与特殊字符转换为 %XX 形式，确保 URL 在传输中的安全与正确解析。空格通常编码为 %20 或 +。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var input = document.getElementById('urlInput');
    var output = document.getElementById('urlOutput');
    var error = document.getElementById('urlError');
    function showErr(m) { error.textContent = m; error.classList.add('show'); }
    function hideErr() { error.classList.remove('show'); }
    document.getElementById('urlEncode').addEventListener('click', function () {
        hideErr();
        if (!input.value) { showErr('请输入要编码的内容'); return; }
        try {
            output.value = encodeURIComponent(input.value);
        } catch (e) { showErr('编码失败'); }
    });
    document.getElementById('urlDecode').addEventListener('click', function () {
        hideErr();
        if (!input.value) { showErr('请输入要解码的内容'); return; }
        try {
            output.value = decodeURIComponent(input.value.replace(/\+/g, '%20'));
        } catch (e) { showErr('解码失败：不是合法的 URL 编码内容'); }
    });
    document.getElementById('urlClear').addEventListener('click', function () {
        input.value = ''; output.value = ''; hideErr(); input.focus();
    });
})();
</script>
</body></html>

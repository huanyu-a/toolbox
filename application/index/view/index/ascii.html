<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.ascii.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.ascii.keywords}" /><meta name="description" content="{$Think.config.web.ascii.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" /><link href="/static/style/site.min.css" rel="stylesheet" type="text/css" /><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}
<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🔠</span>ASCII 码转换工具</h2>
        <p class="tool-desc">字符与 ASCII 十进制 / 十六进制编码互转，支持批量转换整段文本。</p>
        <div class="t-grid">
            <div class="t-col">
                <label class="t-label" for="ascInput">文本</label>
                <textarea class="t-area" id="ascInput" rows="6" placeholder="输入字符或文本…"></textarea>
                <div class="tool-actions">
                    <button class="t-btn" type="button" id="ascToCode">转为 ASCII 码</button>
                </div>
            </div>
            <div class="t-col">
                <label class="t-label" for="ascOutput">ASCII 码（十进制，空格分隔）</label>
                <textarea class="t-area" id="ascOutput" rows="6" placeholder="例如：65 66 67"></textarea>
                <div class="tool-actions">
                    <button class="t-btn t-btn-ok" type="button" id="ascToText">转为文本</button>
                </div>
            </div>
        </div>
        <div class="tool-actions" style="margin-top:16px">
            <button class="t-btn t-btn-ghost" type="button" data-copy="#ascOutput">复制结果</button>
            <button class="t-btn t-btn-ghost" type="button" id="ascClear">清空</button>
        </div>
        <div class="t-error" id="ascError"></div>
    </div>
    <div class="tool-card">
        <h2 class="tool-title">📖 ASCII 对照表（常用）</h2>
        <p class="tool-desc">常用 ASCII 码：空格 32，数字 0-9 为 48-57，大写字母 A-Z 为 65-90，小写字母 a-z 为 97-122。回车 13，换行 10。</p>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var error = document.getElementById('ascError');
    function showErr(m) { error.textContent = m; error.classList.add('show'); }
    function hideErr() { error.classList.remove('show'); }
    document.getElementById('ascToCode').addEventListener('click', function () {
        hideErr();
        var v = document.getElementById('ascInput').value;
        if (!v) { showErr('请输入文本'); return; }
        var codes = [];
        for (var i = 0; i < v.length; i++) codes.push(v.charCodeAt(i));
        document.getElementById('ascOutput').value = codes.join(' ');
    });
    document.getElementById('ascToText').addEventListener('click', function () {
        hideErr();
        var v = document.getElementById('ascOutput').value.trim();
        if (!v) { showErr('请输入 ASCII 码'); return; }
        var parts = v.split(/\s+/);
        var out = '';
        for (var i = 0; i < parts.length; i++) {
            var n = parseInt(parts[i], 10);
            if (isNaN(n) || n < 0 || n > 65535) { showErr('存在无效的 ASCII 码：' + parts[i]); return; }
            out += String.fromCharCode(n);
        }
        document.getElementById('ascInput').value = out;
    });
    document.getElementById('ascClear').addEventListener('click', function () {
        document.getElementById('ascInput').value = '';
        document.getElementById('ascOutput').value = '';
        hideErr();
    });
})();
</script>
</body></html>

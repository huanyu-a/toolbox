<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.zipstringtext.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.zipstringtext.keywords}" /><meta name="description" content="{$Think.config.web.zipstringtext.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" />
<link href="/static/style/site.min.css" rel="stylesheet" type="text/css"/><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}<div class="container"><div class="tool-wrap"><div class="tool-card"><h2 class="tool-title"><span class="t-ico">🗜️</span>字符串文本压缩工具</h2><p class="tool-desc">在线字符串文本压缩工具提供内容去空格,去换行,删空白行,删除回车,去除制表符等</p><form id="form1" class="form-horizontal" method="post">
<div class="form-group">
		<div class="col-sm-12">
			<textarea onmouseover="this.focus();" id="content" name="content" class="form-control" rows="10" placeholder="请输入要压缩的内容或字符串"></textarea>
		</div>
	</div>
	<div class="form-group">
		<div class="col-sm-12 text-center"><button type="button" id="encode" class="btn btn-success" onclick="StrReplace()">压缩文本/字符串</button><span id="copyallcode" class="btn btn-default" data-clipboard-target="#result">复制结果</span><input type="button" onclick="ClearAll();" value="清空" class="btn btn-default"></div>
	</div>
<div class="form-group"><div class="col-sm-12"><pre><code id="result"></code></pre></div></div>
</form></div></div></div><script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script><script src="/static/script/bootstrap.min.js" type="text/javascript"></script><script src="/static/script/tool.js" type="text/javascript"></script><script src="/static/script/hightout.js"></script><script>
function StrReplace(){var StrInput=$("#content").val();StrInput=formatStr(StrInput);StrInput=replaceSpace(StrInput);hightout(StrInput)}function formatStr(strInput){strInput=strInput.replace(/\r/ig,"");strInput=strInput.replace(/\n/ig,"");strInput=strInput.replace(/\s/ig,"");return strInput}function replaceSpace(strInput){return strInput.replace(/[ ]/g,"")}			
</script>{include file="nav" /}
{include file="link" /}
{include file="footer" /}
<script src="/static/script/app.js" type="text/javascript"></script>
</body></html>

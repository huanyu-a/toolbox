<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" /><title>{$Think.config.web.zipstringtext.title}</title><meta name="applicable-device" content="pc,mobile" /><meta http-equiv="Cache-Control" content="no-transform" /><meta http-equiv="Cache-Control" content="no-siteapp" /><meta name="keywords" content="{$Think.config.web.zipstringtext.keywords}" /><meta name="description" content="{$Think.config.web.zipstringtext.description}" /><meta name="renderer" content="webkit" /><meta name="apple-mobile-web-app-capable" content="yes" /><link rel="icon" href="/favicon.ico" mce_href="/favicon.ico" type="image/x-icon" />
<link href="/static/style/site.min.css" rel="stylesheet" type="text/css"/><!--[if lt IE 9]><script src="//apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script><script src="//apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script><![endif]-->{:$Think.config.web.header}{include file="seo" /}</head><body>{include file="header" /}<div class="container"><div class="tool-wrap">
    <div class="tool-card">
        <h2 class="tool-title"><span class="t-ico">🗜️</span>字符串文本压缩工具</h2>
        <p class="tool-desc">在线字符串文本压缩工具提供内容去空格,去换行,删空白行,删除回车,去除制表符等</p>
        <div class="t-row">
            <label class="t-label" for="content">原文（含空格 / 换行 / 制表符）</label>
            <textarea class="t-area" id="content" rows="8" placeholder="请输入要压缩的内容或字符串"></textarea>
        </div>
        <div class="tool-actions">
            <button class="t-btn t-btn-ok" type="button" id="doZip">压缩文本/字符串 →</button>
        </div>
        <div class="t-result">
            <label class="t-label" for="result">压缩结果</label>
            <textarea class="t-area" id="result" rows="8" readonly placeholder="压缩结果将显示在这里"></textarea>
            <div class="tool-actions">
                <button class="t-btn t-btn-ghost t-copy" type="button" data-copy="#result">复制结果</button>
                <button class="t-btn t-btn-ghost" type="button" id="zipClear">清空</button>
            </div>
        </div>
        <div class="t-result" id="zipInfo"></div>
        <div class="t-error" id="zipError"></div>
    </div>
</div></div>
{include file="nav" /}
{include file="footer" /}
<script src="/static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
<script src="/static/script/bootstrap.min.js" type="text/javascript"></script>
<script src="/static/script/toolbox.js"></script>
<script src="/static/script/app.js" type="text/javascript"></script>
<script>
(function () {
    var input = document.getElementById('content');
    var output = document.getElementById('result');
    var error = document.getElementById('zipError');
    var info = document.getElementById('zipInfo');
    function showErr(m) { error.textContent = m; error.classList.add('show'); }
    function hideErr() { error.classList.remove('show'); }
    function clearInfo() { info.textContent = ''; }
    // 压缩：等价原 formatStr + replaceSpace，删除所有 \r \n 空白符与空格
    function zipStr(s) {
        return s.replace(/\r/g, '').replace(/\n/g, '').replace(/\s/g, '').replace(/[ ]/g, '');
    }
    document.getElementById('doZip').addEventListener('click', function () {
        hideErr(); clearInfo();
        var v = input.value;
        if (!v) { showErr('请输入要压缩的内容或字符串'); return; }
        var z = zipStr(v);
        output.value = z;
        info.textContent = '压缩前 ' + v.length + ' 字符 → 压缩后 ' + z.length + ' 字符';
    });
    document.getElementById('zipClear').addEventListener('click', function () {
        input.value = ''; output.value = ''; hideErr(); clearInfo(); input.focus();
    });
})();
</script>
</body></html>

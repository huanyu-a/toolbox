<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>编辑文件 - {$Think.config.web.site.name}后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/theme.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title"><a class="back" href="/{$Think.config.admin.path}/file/index.html">← 返回列表</a> / {$name}</h1>
    <div class="card">
        <form method="post" action="">
            <div class="form-item">
                <textarea class="form-textarea" id="Xcode" name="Xcode" style="min-height:560px">{$content}</textarea>
            </div>
            <div class="form-actions">
                <button class="btn" type="submit">保存</button>
                <a class="btn btn-ghost" href="/{$Think.config.admin.path}/file/index.html">取消</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>

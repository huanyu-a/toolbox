<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>文件管理 - {$Think.config.web.site.name}后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/theme.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title">📁 工具页文件管理</h1>
    <div class="card">
        <p class="card-desc">application/index/view/index/ 目录下的工具页面模板（{$filelist|count} 个文件）。点击文件名可编辑内容。</p>
        <table class="data-table">
            <thead>
            <tr>
                <th style="width:45%">名称</th>
                <th style="width:15%">大小</th>
                <th style="width:25%">修改时间</th>
                <th style="width:15%">操作</th>
            </tr>
            </thead>
            <tbody>
            {foreach $filelist as $vo}
            <tr>
                <td><a href="{:url('file/html')}?file={$vo.0}">📄 {$vo.0}</a></td>
                <td class="num">{$vo.1|number_format=###,1} KB</td>
                <td class="num">{$vo.2}</td>
                <td>
                    <a class="btn btn-sm btn-ghost" href="{:url('file/html')}?file={$vo.0}">编辑</a>
                </td>
            </tr>
            {/foreach}
            </tbody>
        </table>
    </div>
</div>
</body>
</html>

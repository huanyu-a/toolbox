<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>管理员登录 - 在线工具箱后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body class="login-page">
<div class="login-card">
    <h1>🔧 在线工具箱</h1>
    <p class="login-sub">后台管理系统</p>
    <form data-ajax data-redirect="./index.html" method="post" action="?">
        <div class="form-item">
            <label>用户名</label>
            <input class="form-input" type="text" name="username" placeholder="请输入用户名" autocomplete="off" required>
        </div>
        <div class="form-item">
            <label>密码</label>
            <input class="form-input" type="password" name="password" placeholder="请输入密码" autocomplete="off" required>
        </div>
        <div class="form-item">
            <label>验证码</label>
            <div class="captcha-row">
                <input class="form-input" type="text" name="captcha" placeholder="验证码" autocomplete="off" required>
                <div class="captcha-img">
                    <img id="captchaPic" src="{:captcha_src()}" onclick="this.src='{:captcha_src()}?r='+Math.random();" alt="验证码" title="点击刷新">
                </div>
            </div>
        </div>
        <button class="btn btn-block" type="submit">登 录</button>
    </form>
</div>
<script src="/static/admin/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>修改密码 - {$Think.config.web.site.name}后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/theme.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title">🔑 修改密码<a class="theme-toggle-sm" href="javascript:;" onclick="var t=AdminTheme.toggle();var s=this.querySelector('span');s.textContent=t==='dark'?'☀️':'🌙';this.title=t==='dark'?'切换到浅色模式':'切换到深色模式';" title="切换深浅色模式"><span>🌙</span></a></h1>
    <div class="card" style="max-width:480px">
        <form data-ajax method="post" action="">
            <div class="form-item">
                <label>用户名</label>
                <input class="form-input" type="text" name="username" value="{$config.username}" required>
            </div>
            <div class="form-item">
                <label>旧密码</label>
                <input class="form-input" type="password" name="oldpwd" placeholder="请输入当前管理员密码" autocomplete="off">
            </div>
            <div class="form-item">
                <label>新密码</label>
                <input class="form-input" type="password" name="newpwd" placeholder="不修改请留空" autocomplete="off">
            </div>
            <div class="form-item">
                <label>确认新密码</label>
                <input class="form-input" type="password" name="newpwd2" placeholder="不修改请留空" autocomplete="off">
            </div>
            <p class="form-hint" style="margin-top:-6px">修改用户名或密码后需要重新登录。</p>
            <div class="form-actions">
                <button class="btn" type="submit">确认修改</button>
            </div>
        </form>
    </div>
</div>
<script src="/static/admin/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>清除缓存 - {$Think.config.web.site.name}后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/theme.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title">🧹 清除缓存<a class="theme-toggle-sm" href="javascript:;" onclick="var t=AdminTheme.toggle();var s=this.querySelector('span');s.textContent=t==='dark'?'☀️':'🌙';this.title=t==='dark'?'切换到浅色模式':'切换到深色模式';" title="切换深浅色模式"><span>🌙</span></a></h1>
    <div class="card">
        <h3>运行时缓存</h3>
        <p class="card-desc">清除 runtime 目录下的模板编译缓存与数据缓存，站点会重新生成。</p>
        <form data-ajax data-reload="1" method="post" action="">
            <button class="btn" type="submit">清除缓存</button>
        </form>
    </div>
</div>
<script src="/static/admin/js/admin.js"></script>
</body>
</html>

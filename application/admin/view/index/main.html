<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>系统信息 - {$Think.config.web.site.name}后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/theme.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title">🏠 系统信息</h1>
    <div class="card">
        <h3>服务器信息</h3>
        <table class="info-table">
            <tr><td>框架版本</td><td>{$info.framework_version}</td></tr>
            <tr><td>PHP 版本</td><td>{$info.php_version}</td></tr>
            <tr><td>WEB 软件</td><td>{$info.software}</td></tr>
            <tr><td>操作系统</td><td>{$info.os}</td></tr>
            <tr><td>服务器时间</td><td>{$info.date}</td></tr>
        </table>
    </div>
</div>
</body>
</html>

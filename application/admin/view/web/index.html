<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>全局配置 - {$Think.config.web.site.name}后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/theme.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title">⚙️ 网站配置</h1>
    <form method="post" action="">
        {foreach $web as $key=>$vo}
        <div class="card">
            {if is_array($vo)}
            <h3>{$key|pageapi}{if condition="$key != 'site'"}页面 <a class="back" href="/{$key}" target="_blank">打开页面 ↗</a>{/if}</h3>
            {foreach $vo as $key2=>$vo2}
            <div class="form-item">
                <label>{$key2|pageapi}</label>
                <input class="form-input" type="text" name="web[{$key}][{$key2}]" value="{$vo2}">
            </div>
            {/foreach}
            {else/}
            <h3>{$key|pageapi}</h3>
            <div class="form-item">
                <textarea class="form-textarea" name="web[{$key}]" style="min-height:300px">{$content}</textarea>
            </div>
            {/if}
        </div>
        {/foreach}
        <div class="form-actions">
            <button class="btn" type="submit">保存配置</button>
        </div>
    </form>
</div>
</body>
</html>

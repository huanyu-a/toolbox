<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>友情链接 - {$Think.config.web.site.name}后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/theme.js"></script>
</head>
<body>
<div class="page">
    <h1 class="page-title">🔗 友情链接<a class="theme-toggle-sm" href="javascript:;" onclick="var t=AdminTheme.toggle();var s=this.querySelector('span');s.textContent=t==='dark'?'☀️':'🌙';this.title=t==='dark'?'切换到浅色模式':'切换到深色模式';" title="切换深浅色模式"><span>🌙</span></a></h1>
    <div class="card">
        <p class="card-desc">首页底部的友情链接，存储于数据库（更新/重建镜像不丢失）。按排序号从小到大展示，停用的条目前台隐藏。</p>
        <p style="margin:0 0 16px"><a class="btn btn-sm" href="/{$Think.config.admin.path}/web/linkEdit.html">＋ 新增链接</a></p>
        <table class="data-table">
            <thead>
            <tr>
                <th style="width:22%">网站名称</th>
                <th style="width:34%">URL</th>
                <th style="width:8%">排序</th>
                <th style="width:12%">状态</th>
                <th style="width:24%">操作</th>
            </tr>
            </thead>
            <tbody>
            {volist name="list" id="vo"}
            <tr>
                <td>{$vo.name}</td>
                <td class="num"><a href="{$vo.url}" target="_blank" rel="noopener">{$vo.url}</a></td>
                <td class="num">{$vo.sort}</td>
                <td>{if condition="$vo.status eq 1"}<span style="color:var(--ok);font-weight:600">启用</span>{else/}<span style="color:var(--text-3)">停用</span>{/if}</td>
                <td>
                    <a class="btn btn-sm btn-ghost" href="/{$Think.config.admin.path}/web/linkEdit.html?id={$vo.id}">编辑</a>
                    <form method="post" action="/{$Think.config.admin.path}/web/linkDel.html" data-confirm="确定删除「{$vo.name}」吗？删除后不可恢复。" style="display:inline-block;margin-left:6px">
                        <input type="hidden" name="id" value="{$vo.id}">
                        <button class="btn btn-sm btn-danger" type="submit">删除</button>
                    </form>
                </td>
            </tr>
            {/volist}
            {if condition="empty($list)"}
            <tr><td colspan="5" style="text-align:center;color:var(--text-3);padding:24px 0">暂无友情链接，点击上方「新增链接」添加</td></tr>
            {/if}
            </tbody>
        </table>
    </div>
</div>
<script src="/static/admin/js/admin.js"></script>
</body>
</html>

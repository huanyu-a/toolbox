<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>友情链接 - 在线工具箱后台</title>
    <link rel="stylesheet" href="/static/admin/css/admin.css">
</head>
<body>
<div class="page">
    <h1 class="page-title">🔗 友情链接</h1>
    <div class="card">
        <p class="card-desc">编辑 application/index/view/link.html 中的友链内容，保存后前台首页立即生效。</p>
        <form method="post" action="">
            <div class="form-item">
                <textarea class="form-textarea" id="Xcode" name="Xcode" style="min-height:240px">{$content}</textarea>
            </div>
            <div class="form-actions">
                <button class="btn" type="submit">保存</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>

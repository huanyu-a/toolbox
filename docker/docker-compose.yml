# 在线工具箱 - Docker Compose 部署
# 用法：
#   docker compose up -d          # 构建并启动
#   docker compose down           # 停止
#   docker compose logs -f        # 查看日志
# 后台管理：http://<服务器IP>:8080/admin
# 环境变量：
#   USERNAME / PASSWORD：后台账号密码（默认 admin/admin，仅首次设置时写入）
# 数据持久化：
#   config/   后台网站配置、账号配置（挂载 volume，重启不丢失）
#   runtime/  框架运行缓存与日志（挂载 volume）
services:
  toolbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: toolbox:latest
    container_name: toolbox
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - TZ=Asia/Shanghai
      - USERNAME=admin
      - PASSWORD=admin
    volumes:
      - toolbox-config:/var/www/html/config
      - toolbox-runtime:/var/www/html/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  toolbox-config:
  toolbox-runtime:

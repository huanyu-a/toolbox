<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>probe</title></head>
<body>
<script>
var log = [];
function measure() {
  try {
    var ifr = document.getElementById('f');
    var d = ifr.contentDocument;
    var w = ifr.contentWindow;
    var vw = w.innerWidth;
    var nav = d.getElementById('floatCatNav');
    var nr = nav.getBoundingClientRect();
    var navVisible = w.getComputedStyle(nav).display !== 'none';
    if (!navVisible) { log.push('W=' + vw + ' nav=hidden'); document.title = log.join(' || '); return; }
    var navLeft = nr.left;
    var checks = [];
    var sels = ['.home-wrap .container', '.home-cats', '.tool-wrap', '.container > .row'];
    sels.forEach(function (sel) {
      var el = d.querySelector(sel);
      if (!el) return;
      var r = el.getBoundingClientRect();
      var pr = parseFloat(w.getComputedStyle(el).paddingRight) || 0;
      var contentRight = r.right - pr;
      var clear = Math.round(contentRight) <= Math.round(navLeft - 4);
      checks.push(sel + '@' + Math.round(contentRight) + (clear ? 'ok' : 'OVERLAP'));
    });
    log.push('W=' + vw + ' navLeft=' + Math.round(navLeft) + ' | ' + checks.join(' '));
    document.title = log.join(' || ');
  } catch(e) { log.push('ERR ' + e.message); document.title = log.join(' || '); }
}
</script>
<iframe id="f" src="/" style="width:100%;height:500px;border:0" onload="setTimeout(measure, 900)"></iframe>
</body>
</html>
